<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cw-sample-03-html-remake | Before / After</title>
  <meta name="description" content="既存HTML/CSSを改修し、テイスト変更と構成調整を行ったBefore/After比較サンプル" />
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="container">
    <header class="header">
      <p class="badge">cw-sample-03-html-remake</p>
      <h1>既存HTML/CSS 改修サンプル</h1>
      <p class="lead">
        Before（改修前）と After（改修後）を比較できます。<br />
        目的：テイスト変更 / 構成調整 / UI改善（レスポンシブ含む）
      </p>
    </header>

    <section class="grid">
      <a class="card" href="./before/index.html">
        <h2>Before</h2>
        <p>改修前の状態（既存HTML/CSS）</p>
        <span class="cta">開く →</span>
      </a>

      <a class="card" href="./after/index.html">
        <h2>After</h2>
        <p>改修後の状態（テイスト変更＋構成調整）</p>
        <span class="cta">開く →</span>
      </a>
    </section>

    <footer class="footer">
      <p>
        ※ ブラウザのタブを2つ開いて見比べると違いが分かりやすいです。
      </p>
    </footer>
  </main>
</body>
</html>
